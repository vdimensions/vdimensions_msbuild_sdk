name: Publish NuGet Packages

on:
  push:
    branches: 
      - master
      - preview

env:
  VERSION_PREFIX: 0.7

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute Version
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            SAFE_BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '.')
            DATE=$(date +%Y-%m-%d)
            echo "VERSION_SUFFIX=${SAFE_BRANCH_NAME}.${DATE}" >> $GITHUB_ENV
          fi

      - name: Print Version Info
        run: |
          echo "Final version: $VERSION_PREFIX.${{ github.run_number }}${VERSION_SUFFIX:+-$VERSION_SUFFIX}"

      - name: Build Packages
        run: |
          chmod +x ./build.sh
          ./build.sh "$VERSION_PREFIX.${{ github.run_number }}" "$VERSION_SUFFIX"

      - name: Push Packages to NuGet.org
        run: |
          dotnet nuget push "dist/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate