name: Publish NuGet Packages

on:
  push:
    branches: [ master ]

env:
  VERSION_PREFIX: 0.7

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute Version
        run: 'echo "PACKAGE_VERSION=$VERSION_PREFIX.${{ github.run_number }}" >> $GITHUB_ENV'

      - name: Print Version
        run: |
          echo "Package version1: $PACKAGE_VERSION"
          echo "Package version2: $VERSION_PREFIX.${{ github.run_number }}"

      - name: Build Packages
        run: |
          chmod +x ./build.sh
          ./build.sh "$PACKAGE_VERSION"

      # - name: Push Packages to NuGet.org
      #   run: |
      #     dotnet nuget push "dist/*.nupkg" \
      #       --api-key ${{ secrets.NUGET_API_KEY }} \
      #       --source https://api.nuget.org/v3/index.json \
      #       --skip-duplicate